
name: Full CI
on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    environment:
      name: azure-ai-tests
      deployment: false
    permissions:
      contents: read # checkout
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false

# https://docs.astral.sh/uv/guides/integration/github/#setting-up-python
    - name: "Set up Python"
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version-file: pyproject.toml

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # Install a specific version of uv.
        version: "0.13.7"

    - name: Install deps
      run: uv sync --locked

    - name: Check format
      run: make check_format

    - name: Run test run
      timeout-minutes: 5
      env:
        OPENAI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
        OPENAI_BASE_URL: ${{ vars.AZURE_AI_BASE_URL }}
      run: uv run python ./src/flare/main.py  --config-path ./tests/data/example_config.json --sample-path ./tests/data/bias-samples/ --name test-run
    
    - name: Show logs for debugging purpose
      if: ${{ !cancelled() }}
      run: cat runs/test-run/run.log

    - name: Ensure good number of results
      run: |
       count=$(find runs/test-run/result/ -type f | wc -l)
       if test $count -ne 2
       then 
          echo "Wrong number of results"
          exit 1
       fi

    - name: Ensure wheel is buildable
      run: uv build